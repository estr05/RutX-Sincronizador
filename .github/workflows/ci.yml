# ============================================================
# CI — RutX-Sincronizador
# Ejecuta en cada push y PR hacia main y las ramas de integración.
# Pasos: secret-scan (gitleaks) -> restore → build -> gate secretos
#        propio -> unit tests (windows)
# ============================================================
name: "Sincronizador CI"

on:
  push:
    branches: ["main", "fix/sprint4-secrets-firebird", "cloudflare-tunnel", "review/cloudflare-installer"]
  pull_request:
    # pull_request.branches filtra la rama DESTINO del PR. demo es el destino de
    # integracion; el PR review/cloudflare-installer -> demo dispara todo el pipeline.
    # El segundo PR demo -> dev (ya cubierto por main/dev) se validara aparte.
    branches: ["main", "fix/sprint4-secrets-firebird", "cloudflare-tunnel", "demo"]

jobs:
  secret-scan:
    name: "Secret Scan"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        continue-on-error: false

  build-and-test:
    name: ".NET Build & Test"
    runs-on: windows-latest
    needs: secret-scan
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - name: Restore dependencies
        run: dotnet restore rutx-sincronizador.sln

      - name: Build (Release)
        run: dotnet build rutx-sincronizador.sln --configuration Release --no-restore

      - name: Secret scan (Invoke-SecretScan.ps1 - gate propio)
        shell: pwsh
        run: ./Scripts/Invoke-SecretScan.ps1

      - name: Run unit tests
        run: |
          if [ -d "Rutx.Sincronizador.Tests" ]; then
            dotnet test Rutx.Sincronizador.Tests \
              --configuration Release \
              --filter "Category!=Integration" \
              --logger "console;verbosity=normal" \
              --results-directory ./TestResults \
              -- RunConfiguration.TestSessionTimeout=120000
          else
            echo "No se encontró el directorio de tests. Omitiendo."
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-sincronizador
          path: TestResults/
          retention-days: 7
